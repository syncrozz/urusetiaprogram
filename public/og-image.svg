<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="1050" cy="180" r="320" fill="#059669" opacity="0.18" filter="url(#ogGlow)" />
  <circle cx="150" cy="500" r="280" fill="#0284c7" opacity="0.12" filter="url(#ogGlow)" />

  <!-- Decorative Tech Grid lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="560" y1="0" x2="560" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="880" y1="0" x2="880" y2="630" />
    <line x1="1040" y1="0" x2="1040" y2="630" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="540" x2="1200" y2="540" />
  </g>

  <!-- Brand Badge Top Left -->
  <g transform="translate(100, 85)">
    <rect width="210" height="38" rx="19" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#10b981" />
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0" letter-spacing="1">PUSAT URUSETIA KPM</text>
  </g>

  <!-- Main Headline & Subtitle -->
  <text x="100" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    SOAR 2026
  </text>
  <text x="465" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="900" fill="#10b981" letter-spacing="-1.5">
    .
  </text>

  <text x="100" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#e2e8f0">
    Platform Penyelarasan &amp; Kesediaan Urusetia Program
  </text>

  <text x="100" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    Pemantauan 6 Kategori Unit • Templat Blueprint • Hab Import CSV • Offline PWA Ready
  </text>

  <!-- 3 Feature Chips -->
  <g transform="translate(100, 380)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="180" height="46" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#38bdf8">⚡ PWA &amp; Offline</text>

    <!-- Chip 2 -->
    <rect x="196" y="0" width="190" height="46" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="216" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#34d399">📋 6 Kategori Unit</text>

    <!-- Chip 3 -->
    <rect x="402" y="0" width="200" height="46" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="422" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#fbbf24">📊 Hab CSV &amp; Sandaran</text>
  </g>

  <!-- Right Visual Dashboard Mockup Card -->
  <g transform="translate(740, 110)">
    <!-- Main Card -->
    <rect width="360" height="420" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" />
    
    <!-- Top Bar -->
    <circle cx="28" cy="28" r="6" fill="#ef4444" />
    <circle cx="46" cy="28" r="6" fill="#f59e0b" />
    <circle cx="64" cy="28" r="6" fill="#10b981" />
    <text x="100" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">KESEDIAAN PROGRAM</text>

    <!-- Progress Circle representation -->
    <circle cx="180" cy="145" r="65" stroke="#1e293b" stroke-width="14" fill="none" />
    <circle cx="180" cy="145" r="65" stroke="#10b981" stroke-width="14" fill="none" stroke-dasharray="408" stroke-dashoffset="60" stroke-linecap="round" />
    <text x="180" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff">86%</text>
    <text x="180" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#10b981">SIAP SIAGA</text>

    <!-- Unit mini list items -->
    <g transform="translate(24, 235)">
      <rect width="312" height="44" rx="10" fill="#0f172a" stroke="#1e293b" />
      <text x="14" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Unit Program &amp; Atur Cara</text>
      <rect x="235" y="14" width="62" height="18" rx="4" fill="#064e3b" />
      <text x="246" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399">100%</text>
    </g>

    <g transform="translate(24, 290)">
      <rect width="312" height="44" rx="10" fill="#0f172a" stroke="#1e293b" />
      <text x="14" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Unit Teknikal &amp; PA Sistem</text>
      <rect x="245" y="14" width="52" height="18" rx="4" fill="#0c4a6e" />
      <text x="256" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">80%</text>
    </g>

    <g transform="translate(24, 345)">
      <rect width="312" height="44" rx="10" fill="#0f172a" stroke="#1e293b" />
      <text x="14" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Unit Logistik &amp; Pentas</text>
      <rect x="245" y="14" width="52" height="18" rx="4" fill="#064e3b" />
      <text x="256" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399">75%</text>
    </g>
  </g>

  <!-- Bottom status line -->
  <g transform="translate(100, 560)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b">
      Kolej Profesional MARA / Institut Pengajian Tinggi • Sistem Pemantauan Standard Pengurusan Acara
    </text>
  </g>
</svg>
