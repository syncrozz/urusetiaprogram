<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Subtle grid pattern -->
  <path d="M 64 256 H 448 M 256 64 V 448" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="160" stroke="#064e3b" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="256" cy="256" r="100" stroke="#047857" stroke-width="2" fill="none" stroke-dasharray="6 6" opacity="0.3"/>

  <!-- Stylized Syncrozz interconnected sync nodes & S-curve -->
  <g filter="url(#glow)">
    <!-- Main S swirl & synchronizing loop -->
    <path d="M 330 150 C 370 150 390 180 390 215 C 390 260 320 280 256 280 C 190 280 120 300 120 345 C 120 385 150 410 200 410 C 260 410 320 370 340 330" 
          fill="none" 
          stroke="url(#syncGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Complementary sync loop path -->
    <path d="M 182 362 C 142 362 122 332 122 297 C 122 252 192 232 256 232 C 322 232 392 212 392 167 C 392 127 362 102 312 102 C 252 102 192 142 172 182" 
          fill="none" 
          stroke="url(#syncGrad)" 
          stroke-width="16" 
          stroke-linecap="round" 
          opacity="0.85"/>

    <!-- Focal Coordination Nodes -->
    <circle cx="330" cy="150" r="18" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
    <circle cx="256" cy="256" r="22" fill="#06b6d4" stroke="#ffffff" stroke-width="5"/>
    <circle cx="182" cy="362" r="18" fill="#3b82f6" stroke="#ffffff" stroke-width="4"/>

    <!-- Success Checkmark on center node -->
    <path d="M 246 256 L 253 263 L 268 248" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Gold Star / Excellence pip -->
  <polygon points="390,110 396,124 410,124 398,133 403,147 390,138 377,147 382,133 370,124 384,124" fill="url(#goldGrad)" />
</svg>
